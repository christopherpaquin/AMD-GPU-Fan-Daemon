[project]
name = "amd-gpu-fan-daemon"
version = "0.1.0"
description = "GPU-aware motherboard fan control daemon (AMD/amdgpu + nct6775)."
requires-python = ">=3.9"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
